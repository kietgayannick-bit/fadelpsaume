plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.fadelpsaume.vpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.fadelpsaume.vpn"
        minSdk 24
        targetSdk 33
        versionCode 20
        versionName "2.0.0"
        ndk { abiFilters "arm64-v8a" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true                       // extrait les .so sur le disque : indispensable pour lancer Xray
            keepDebugSymbols += ["**/libxray.so", "**/libdnstt.so"]   // ne pas « strip » ces exécutables
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "paramiko"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.12.0"
}
