name: Construire Fadelpsaume (APK)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Installer Android SDK + NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"; fi
          if [ -z "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/clt
            curl -fL -o /tmp/clt/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt/clt.zip -d /tmp/clt
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager = $SDKM"
          set +o pipefail
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" | tail -5
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: Moteur Xray (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/xray
          curl -fL -o /tmp/xray/x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o /tmp/xray/x.zip -d /tmp/xray
          cp /tmp/xray/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          ls -l app/src/main/jniLibs/arm64-v8a/

      - name: Tunnel VPN (hev-socks5-tunnel)
        run: |
          mkdir -p /tmp/hev/jni && cd /tmp/hev
          echo 'include $(call all-subdir-makefiles)' > jni/Android.mk
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel jni/hev-socks5-tunnel
          # le nom de la classe Java attendu par la bibliothèque (doit être hev/htproxy/TProxyService)
          grep -rn "htproxy\|TProxyService" jni/hev-socks5-tunnel/src/hev-jni.c | head -5 || true
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-24 NDK_LIBS_OUT=./libs NDK_OUT=./obj
          cp libs/arm64-v8a/libhev-socks5-tunnel.so "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Client SlowDNS (dnstt) - facultatif
        continue-on-error: true
        run: |
          GOBIN=/tmp/dnstt GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go install www.bamsoftware.com/git/dnstt.git/dnstt-client@latest
          f=$(find /tmp/dnstt -name 'dnstt-client' | head -1)
          cp "$f" app/src/main/jniLibs/arm64-v8a/libdnstt.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk Fadelpsaume.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Fadelpsaume-apk
          path: Fadelpsaume.apk

      - name: Publier une version (pour télécharger depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fadelpsaume APK #${{ github.run_number }}
          files: Fadelpsaume.apk
